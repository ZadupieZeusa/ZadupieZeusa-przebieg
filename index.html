<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0f0f10">
<script>if(navigator.standalone||matchMedia('(display-mode: standalone)').matches)document.documentElement.classList.add('standalone');</script>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Przebieg">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23141414'/%3E%3Cpath d='M14 44 L26 28 L34 36 L50 18' stroke='%234ade80' stroke-width='6' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<title>Przebieg</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#0f0f10;--panel:#151516;--surface:#1c1c1e;--surface2:#262628;--surface3:#303033;
  --border:#2a2a2d;--border2:#3a3a3e;--text:#f2f2f3;--text2:#a0a0a6;--text3:#66666c;
  --accent:#4ade80;--accent-ink:#0b1f12;--gold:#fbbf24;--danger:#ff5f5f;--warn:#ffb347;
  --c-pace:#3b82f6;--c-hr:#e8590c;--c-ele:#9b5de5;
  --z0:#3a3a3e;--z1:#4a3a30;--z2:#7a4a2a;--z3:#b45a1e;--z4:#e8590c;--z5:#ff8f57;
  --t-easy:#4ade80;--t-mid:#ffb347;--t-hard:#ff7a59;
  --r:16px;--top-gap:0px;--side:240px;
}
html{background:var(--bg)}
html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);overflow:hidden;display:flex;flex-direction:column;font-size:15px}
button,input,textarea,select{font-family:inherit;font-size:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.top-spacer{display:none;flex-shrink:0;height:var(--top-gap);background:#000}
@media (display-mode: standalone){ :root{--top-gap:calc(env(safe-area-inset-top) + 22px)} .top-spacer{display:block} }
html.standalone{--top-gap:calc(env(safe-area-inset-top) + 22px)}
html.standalone .top-spacer{display:block}

/* ── UKŁAD ── */
.app{flex:1;display:flex;min-height:0}
.side{display:none}
.content{flex:1;display:flex;flex-direction:column;min-width:0}
.head{display:flex;align-items:center;gap:8px;padding:12px calc(14px + env(safe-area-inset-right)) 8px calc(16px + env(safe-area-inset-left));flex-shrink:0}
.head h1{font-size:26px;font-weight:800;letter-spacing:-.6px;flex:1}
.icon-btn{width:40px;height:40px;border-radius:12px;border:none;background:var(--surface);color:var(--text2);display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative}
.icon-btn:hover{color:var(--text);background:var(--surface2)}
.sync-dot{position:absolute;top:8px;right:8px;width:8px;height:8px;border-radius:50%;background:var(--text3);border:2px solid var(--surface)}
.sync-dot.ok{background:var(--accent)}.sync-dot.busy{background:var(--warn)}.sync-dot.err{background:var(--danger)}
main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.view{display:none;max-width:1000px;margin:0 auto;padding:4px calc(14px + env(safe-area-inset-right)) 110px calc(14px + env(safe-area-inset-left))}
.view.active{display:block}

/* dolne menu (telefon) */
.tabbar{flex-shrink:0;display:grid;grid-template-columns:1fr 1fr 76px 1fr 1fr;align-items:end;background:#151516f2;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--border);padding:6px 6px calc(6px + env(safe-area-inset-bottom));position:relative;z-index:60}
.tab{background:none;border:none;color:var(--text3);font-size:11px;font-weight:700;padding:6px 0 2px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer}
.tab.active{color:var(--text)}
.tab.active svg.i{stroke:var(--accent)}
.fab{justify-self:center;width:58px;height:58px;border-radius:20px;border:none;background:var(--accent);color:var(--accent-ink);display:flex;align-items:center;justify-content:center;cursor:pointer;margin-top:-26px;box-shadow:0 8px 24px #4ade8040,0 0 0 5px var(--bg)}
.fab svg.i{width:28px;height:28px;stroke-width:2.4}

/* komputer: pasek boczny */
@media (min-width:900px){
  .tabbar{display:none}
  .side{display:flex;flex-direction:column;width:var(--side);flex-shrink:0;background:var(--panel);border-right:1px solid var(--border);padding:18px 14px}
  .head .icon-btn{display:none}
  .head{padding:22px 28px 10px}
  .view{padding:4px 28px 60px}
}
.brand{display:flex;align-items:center;gap:9px;font-size:19px;font-weight:800;letter-spacing:-.5px;padding:2px 8px 22px}
.brand span{color:var(--accent)}
.nav-item{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:12px;border:none;background:none;color:var(--text2);font-size:15px;font-weight:600;cursor:pointer;text-align:left;width:100%}
.nav-item:hover{background:var(--surface);color:var(--text)}
.nav-item.active{background:var(--surface2);color:var(--text)}
.nav-item.active svg.i{stroke:var(--accent)}
.side .btn-primary{margin:18px 0 0}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:2px}

/* ── KOMPONENTY ── */
.btn-primary{display:flex;align-items:center;justify-content:center;gap:8px;background:var(--accent);color:var(--accent-ink);border:none;border-radius:12px;padding:11px 16px;font-weight:800;cursor:pointer}
.btn-primary:hover{filter:brightness(1.06)}
.btn{display:inline-flex;align-items:center;gap:7px;background:var(--surface2);border:1px solid var(--border2);color:var(--text);border-radius:11px;padding:9px 14px;font-weight:600;font-size:14px;cursor:pointer}
.btn:hover{background:var(--surface3)}
.btn.ghost{background:none}
.btn.danger{color:var(--danger)}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);overflow:hidden}
.card.pad{padding:16px}
.sec{font-size:13px;font-weight:700;color:var(--text2);margin:26px 2px 10px;display:flex;justify-content:space-between;align-items:baseline}
.sec:first-child{margin-top:8px}
.sec a{color:var(--text2);font-weight:600;cursor:pointer;text-decoration:none}
.muted{color:var(--text2)}
.small{font-size:12.5px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media (max-width:720px){.grid4{grid-template-columns:1fr 1fr}.grid3{grid-template-columns:1fr 1fr}}
.stat .lbl{font-size:12px;color:var(--text2);font-weight:600}
.stat .val{font-size:25px;font-weight:800;letter-spacing:-.6px;margin-top:4px;line-height:1.1}
.stat .val small{font-size:13px;font-weight:600;color:var(--text2);margin-left:3px;letter-spacing:0}
.stat .sub{font-size:12.5px;color:var(--text2);margin-top:4px}
.delta{font-weight:700}.delta.up{color:var(--accent)}.delta.down{color:var(--warn)}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:4px 9px;border-radius:999px;background:var(--surface2);color:var(--text2);white-space:nowrap}
.pill i{width:7px;height:7px;border-radius:50%;background:currentColor}
.pill.easy{color:var(--t-easy);background:#4ade8018}.pill.mid{color:var(--t-mid);background:#ffb34718}.pill.hard{color:var(--t-hard);background:#ff7a5918}
.pill.gold{color:var(--gold);background:#fbbf2418}
.seg{display:flex;background:var(--surface);border:1px solid var(--border);border-radius:13px;padding:3px;gap:2px;margin:6px 0 4px}
.seg button{flex:1;border:none;background:none;color:var(--text2);font-weight:700;font-size:14px;padding:8px 6px;border-radius:10px;cursor:pointer}
.seg button.active{background:var(--surface3);color:var(--text)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{background:var(--surface);border:1px solid var(--border2);color:var(--text2);font-size:13px;font-weight:600;padding:7px 12px;border-radius:999px;cursor:pointer}
.chip.active{background:var(--text);color:#0d0d0d;border-color:var(--text)}
.empty{text-align:center;color:var(--text2);padding:36px 18px;font-size:14px;line-height:1.6}
.lines{list-style:none;display:flex;flex-direction:column}
.lines li{display:flex;gap:12px;padding:12px 16px;border-bottom:1px solid var(--border);font-size:14px;line-height:1.55}
.lines li:last-child{border-bottom:none}
.lines li .ic{width:28px;height:28px;border-radius:9px;background:var(--surface2);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:14px}

/* pulpit */
.next{display:flex;gap:14px;padding:16px;background:linear-gradient(135deg,#1d2a21,#1c1c1e 70%);border-color:#2c4033}
.next .ic{width:42px;height:42px;border-radius:13px;background:#4ade8022;color:var(--accent);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.next .t{font-size:12px;font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:.5px}
.next p{font-size:14.5px;line-height:1.55;margin-top:3px}
.last{display:flex;gap:14px;padding:14px;cursor:pointer;align-items:center}
.last:hover{background:#222224}
.last-stats{display:flex;gap:16px;margin-top:8px;font-size:17px;font-weight:800}
.last-stats small{font-size:12px;font-weight:600;color:var(--text2);margin-left:2px}
.week-bars{display:flex;gap:5px;align-items:flex-end;height:46px;margin-top:10px}
.week-bars div{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end}
.week-bars b{width:100%;border-radius:4px 4px 2px 2px;background:var(--accent);min-height:3px}
.week-bars b.zero{background:var(--surface3)}
.week-bars span{font-size:10px;color:var(--text3);font-weight:700}
.split-bar{display:flex;height:10px;border-radius:6px;overflow:hidden;gap:2px;margin:10px 0 8px;background:var(--surface2)}
.split-bar i{display:block;height:100%}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--text2)}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.spark{height:42px;margin-top:8px}

/* lista treningów */
.month-h{display:flex;justify-content:space-between;align-items:baseline;font-size:14px;font-weight:800;margin:22px 4px 8px}
.month-h span{font-size:12.5px;color:var(--text2);font-weight:600}
.act{display:flex;align-items:center;gap:13px;padding:12px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r);margin-bottom:8px;cursor:pointer}
.act:hover{border-color:var(--border2);background:#222224}
svg.thumb{width:58px;height:58px;flex-shrink:0;background:var(--surface2);border-radius:12px}
.act .info{flex:1;min-width:0}
.act .row1{display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.act .ttl{font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.act .when{font-size:12.5px;color:var(--text2);margin-top:2px}
.act .stats{display:flex;gap:14px;margin-top:6px;font-size:14px;font-weight:700}
.act .stats small{color:var(--text2);font-weight:500;font-size:11.5px;margin-left:2px}

/* szczegóły */
.detail{position:fixed;inset:0;background:var(--bg);z-index:400;display:none;flex-direction:column}
.detail.open{display:flex}
.detail-top{display:flex;align-items:center;gap:10px;padding:calc(10px + var(--top-gap)) calc(12px + env(safe-area-inset-right)) 10px calc(12px + env(safe-area-inset-left));border-bottom:1px solid var(--border);background:var(--panel)}
.detail-title{flex:1;min-width:0}
.detail-title b{display:block;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.detail-title span{font-size:12.5px;color:var(--text2)}
.detail-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.detail-inner{max-width:1000px;margin:0 auto;padding:14px calc(14px + env(safe-area-inset-right)) 60px calc(14px + env(safe-area-inset-left))}
#map{height:320px;border-radius:var(--r);border:1px solid var(--border);background:#1a1a1a;z-index:1}
@media (max-width:720px){#map{height:250px}}
.map-dark .leaflet-tile-pane{filter:invert(1) hue-rotate(180deg) brightness(.9) contrast(.85) saturate(.6)}
.map-err{position:absolute;inset:auto 10px 10px 10px;z-index:500;background:#000c;color:var(--text2);font-size:12px;padding:6px 9px;border-radius:8px}
.big-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--border);border:1px solid var(--border);border-radius:var(--r);overflow:hidden;margin-top:12px}
@media (max-width:720px){.big-stats{grid-template-columns:repeat(3,1fr)}}
.big-stats div{background:var(--surface);padding:11px 12px}
.big-stats .lbl{font-size:11px;color:var(--text2);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.big-stats .val{font-size:19px;font-weight:800;margin-top:2px;letter-spacing:-.3px}
.big-stats .val small{font-size:12px;color:var(--text2);font-weight:600;margin-left:2px}
.report{margin-top:12px}
.report-head{display:flex;align-items:center;gap:10px;padding:14px 16px 4px;flex-wrap:wrap}
.report-head b{font-size:16px}
.report-head .muted{margin-left:auto;font-size:12px}
.report p{padding:7px 16px;font-size:14.5px;line-height:1.6;color:#dcdcdf}
.report .facts{display:flex;gap:6px;flex-wrap:wrap;padding:6px 16px}
.report .nextbox{margin:10px 12px 14px;padding:12px 14px;border-radius:12px;background:#4ade8014;border:1px solid #4ade8030;font-size:14px;line-height:1.55}
.report .nextbox b{color:var(--accent)}
.zone-rows{display:flex;flex-direction:column;gap:7px;padding:14px 16px}
.zone-row{display:grid;grid-template-columns:118px 1fr 56px;align-items:center;gap:10px;font-size:12.5px}
.zone-row .zn{color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.zone-row .zn b{color:var(--text);margin-right:5px}
@media (min-width:721px){.zone-row{grid-template-columns:260px 1fr 56px}}
@media (max-width:720px){.zone-row .zname{display:none}}
.grid3.tight{grid-template-columns:repeat(3,1fr)}
@media (max-width:720px){.grid3.tight .card.pad{padding:12px}.grid3.tight .stat .val{font-size:20px}.grid3.tight .stat .val small{display:block;margin:2px 0 0;font-size:11px}.grid3.tight .stat .sub{font-size:11.5px}}
.zone-row .bar{height:10px;background:var(--surface2);border-radius:5px;overflow:hidden}
.zone-row .bar i{display:block;height:100%;border-radius:5px}
.zone-row .zt{text-align:right;font-weight:700}
.effort-chips{display:flex;gap:7px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.effort-chips::-webkit-scrollbar{display:none}
.effort-chip{flex-shrink:0;background:var(--surface);border:1px solid var(--border2);border-radius:12px;padding:8px 12px;cursor:pointer;text-align:left}
.effort-chip .l{font-size:11.5px;color:var(--text2);font-weight:600}
.effort-chip .v{font-size:15px;font-weight:800;margin-top:1px}
.effort-chip.pb .v::after{content:' 🏆';font-size:12px}
.effort-chip.active{border-color:var(--gold);background:#fbbf2418}
.chart-card{padding:12px 12px 6px;margin-bottom:8px}
.chart-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px;gap:8px}
.chart-head b{font-size:13.5px;display:flex;align-items:center;gap:7px}
.chart-head b i{width:10px;height:3px;border-radius:2px;display:inline-block}
.chart-head span{font-size:12px;color:var(--text2);text-align:right}
.chart-box{position:relative;height:130px}
.hover-readout{position:sticky;top:0;z-index:5;background:var(--bg);font-size:12.5px;color:var(--text2);padding:6px 2px;display:flex;gap:14px;min-height:28px;flex-wrap:wrap}
.hover-readout b{color:var(--text)}
table.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
table.tbl th{font-size:11px;color:var(--text2);text-transform:uppercase;letter-spacing:.4px;font-weight:600;text-align:left;padding:9px 12px;border-bottom:1px solid var(--border);white-space:nowrap}
table.tbl td{padding:8px 12px;border-bottom:1px solid var(--border)}
table.tbl tr:last-child td{border-bottom:none}
table.tbl .r{text-align:right}
table.tbl tr.click{cursor:pointer}
table.tbl tr.click:hover td{background:#222224}
table.tbl tr.sel td{background:var(--surface2)}
.sbar{height:8px;border-radius:4px;background:var(--c-pace);opacity:.8}
tr.fast .sbar{background:var(--gold);opacity:1}
.note-box{padding:14px 16px;display:flex;flex-direction:column;gap:12px}
.note-row{display:flex;flex-direction:column;gap:7px}
.note-row>span{font-size:12.5px;color:var(--text2);font-weight:600}
.rpe{display:grid;grid-template-columns:repeat(10,1fr);gap:4px}
.rpe button{border:1px solid var(--border2);background:var(--surface2);border-radius:8px;padding:7px 0;font-weight:700;font-size:13px;cursor:pointer;color:var(--text2)}
.rpe button.active{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.note-box textarea{background:var(--surface2);border:1px solid var(--border2);border-radius:10px;padding:10px;min-height:64px;resize:vertical}
.weather{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}

/* rekordy */
.form-top{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.form-top .vd{font-size:34px;font-weight:800;letter-spacing:-1px}
.form-top .vd small{font-size:13px;color:var(--text2);font-weight:600;margin-left:4px}
.predict{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
@media (max-width:520px){.predict{grid-template-columns:repeat(2,1fr)}}
.predict div{background:var(--surface2);border-radius:11px;padding:10px}
.predict .l{font-size:11.5px;color:var(--text2);font-weight:600}
.predict .v{font-size:18px;font-weight:800;margin-top:2px}
.predict .p{font-size:11.5px;color:var(--text2)}
.rec-row{border-bottom:1px solid var(--border)}
.rec-row:last-child{border-bottom:none}
.rec-head{display:flex;align-items:center;gap:10px;padding:12px 14px;cursor:pointer}
.rec-head:hover{background:#222224}
.rec-head .d{width:86px;flex-shrink:0;font-size:13.5px;font-weight:700}
.rec-head .t{font-size:17px;font-weight:800;min-width:78px}
.rec-head .p{font-size:12px;color:var(--text2);flex:1;white-space:nowrap}
.rec-head .w{font-size:12px;color:var(--text2);text-align:right;white-space:nowrap}
.rec-head .chev{color:var(--text3);font-size:12px;transition:transform .15s}
.rec-row.open .chev{transform:rotate(90deg)}
.rec-row.none .t{color:var(--text3);font-weight:600;font-size:14px}
.rec-body{display:none;padding:2px 14px 14px}
.rec-row.open .rec-body{display:block}
.top-item{display:flex;gap:10px;font-size:13.5px;padding:7px 8px;border-radius:8px;cursor:pointer}
.top-item:hover{background:var(--surface2)}
.top-item .n{width:22px;color:var(--text3);font-weight:700}
.top-item .tm{width:74px;font-weight:700}
.top-item .dt{color:var(--text2);flex:1}
.heat-wrap{overflow-x:auto;padding:12px 12px 8px}
.heat-legend{display:flex;align-items:center;gap:4px;font-size:11px;color:var(--text2);justify-content:flex-end;margin-top:6px}
.heat-legend i{width:11px;height:11px;border-radius:3px;display:inline-block}

/* ciało */
.body-hero{display:grid;grid-template-columns:1.3fr 1fr 1fr 1fr;gap:1px;background:var(--border)}
.body-hero>div{background:var(--surface);padding:14px}
@media (max-width:720px){.body-hero{grid-template-columns:1fr 1fr}}
.entry{display:flex;align-items:center;gap:12px;padding:11px 14px;border-bottom:1px solid var(--border);cursor:pointer;font-size:14px}
.entry:last-child{border-bottom:none}
.entry:hover{background:#222224}
.entry .dt{width:92px;color:var(--text2);font-size:13px}
.entry .w{font-weight:800;width:72px}
.entry .rest{flex:1;color:var(--text2);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* formularze, arkusze */
.overlay{position:fixed;inset:0;background:#000b;z-index:800;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:var(--surface);border:1px solid var(--border2);border-radius:20px;padding:20px;width:100%;max-width:460px;max-height:88vh;overflow-y:auto}
.modal h3{font-size:18px;margin-bottom:8px}
.modal p{font-size:14px;color:var(--text2);line-height:1.55}
.modal .actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
@media (max-width:720px){
  .overlay.sheet{align-items:flex-end;padding:0}
  .overlay.sheet .modal{border-radius:22px 22px 0 0;max-width:none;padding-bottom:calc(20px + env(safe-area-inset-bottom))}
}
.sheet-opt{display:flex;align-items:center;gap:14px;width:100%;padding:14px;border-radius:14px;border:none;background:var(--surface2);margin-top:8px;cursor:pointer;text-align:left}
.sheet-opt:hover{background:var(--surface3)}
.sheet-opt .ic{width:42px;height:42px;border-radius:12px;background:#4ade801c;color:var(--accent);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.sheet-opt b{display:block;font-size:15px}
.sheet-opt span{font-size:12.5px;color:var(--text2)}
.form{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.form label{display:flex;flex-direction:column;gap:5px;font-size:12.5px;color:var(--text2);font-weight:600}
.form label.full{grid-column:1/-1}
.form input{background:var(--surface2);border:1px solid var(--border2);border-radius:10px;padding:10px 11px;font-size:16px;color:var(--text);width:100%}
.form input:focus{outline:2px solid #4ade8066;border-color:var(--accent)}
.hint{font-size:12px;color:var(--text3);line-height:1.5;margin-top:10px}
.progress{height:6px;background:var(--surface3);border-radius:3px;overflow:hidden;margin-top:12px}
.progress i{display:block;height:100%;background:var(--accent);width:0;transition:width .2s}
.pr-list{display:flex;flex-direction:column;gap:6px;margin-top:12px}
.pr-item{display:flex;align-items:center;gap:10px;background:#fbbf2412;border:1px solid #fbbf2440;border-radius:12px;padding:10px 12px;font-size:13.5px}
.pr-item b{color:var(--gold)}
#toast{position:fixed;bottom:calc(96px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:var(--surface2);border:1px solid var(--border2);color:var(--text);padding:10px 16px;border-radius:12px;font-size:13.5px;z-index:950;box-shadow:0 6px 24px #0008;display:none;max-width:calc(100% - 24px)}
#toast.err{border-color:var(--danger)}
.banner{position:fixed;top:calc(var(--top-gap) + 66px);left:50%;transform:translateX(-50%);z-index:700;background:var(--surface);border:1px solid var(--warn);border-radius:12px;padding:8px 10px 8px 14px;display:flex;align-items:center;gap:10px;font-size:13.5px;box-shadow:0 6px 24px #0008;max-width:calc(100% - 24px)}
.btn-sm{background:var(--accent);color:var(--accent-ink);border:none;font-weight:800;font-size:13px;padding:7px 12px;border-radius:9px;cursor:pointer;white-space:nowrap}
.btn-x{background:none;border:none;color:var(--text2);font-size:15px;cursor:pointer;padding:2px 4px}
.tip{position:fixed;pointer-events:none;background:#000e;border:1px solid var(--border2);color:var(--text);font-size:12px;padding:6px 9px;border-radius:8px;z-index:900;display:none;white-space:nowrap}
.welcome{max-width:520px;margin:20px auto;text-align:center}
.welcome h2{font-size:24px;margin:12px 0 8px;letter-spacing:-.5px}
.welcome p{color:var(--text2);font-size:14.5px;line-height:1.6}
.welcome .steps{text-align:left;margin:20px 0;display:flex;flex-direction:column;gap:8px}
.welcome .steps div{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:11px 13px;font-size:13.5px;line-height:1.5;color:var(--text2)}
.welcome .steps b{color:var(--text)}
.welcome .btn-primary{display:inline-flex;padding:12px 22px;font-size:15px}
.leaflet-container{background:#1a1a1a;font-family:inherit}
.leaflet-control-attribution{background:#000a !important;color:#888 !important;font-size:9px !important}
.leaflet-control-attribution a{color:#aaa !important}
.leaflet-bar a{background:var(--surface) !important;color:var(--text) !important;border-color:var(--border2) !important}
.drop-hint{position:fixed;inset:0;background:#4ade8022;border:3px dashed var(--accent);z-index:990;display:none;align-items:center;justify-content:center;font-size:22px;font-weight:800;pointer-events:none}
.drive-menu{position:fixed;z-index:850;background:var(--surface);border:1px solid var(--border2);border-radius:14px;padding:6px;min-width:240px;box-shadow:0 8px 32px #0009}
.drive-menu button{width:100%;text-align:left;background:none;border:none;color:var(--text2);font-size:14px;padding:10px 11px;border-radius:9px;cursor:pointer;display:block}
.drive-menu button:hover{background:var(--surface2);color:var(--text)}
.drive-menu hr{border:none;border-top:1px solid var(--border);margin:4px 0}
</style>
</head>
<body>
<div class="top-spacer"></div>
<div class="app">
  <aside class="side">
    <div class="brand"><svg width="24" height="24" viewBox="0 0 64 64"><path d="M10 46 L24 28 L34 38 L54 16" stroke="var(--accent)" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg><b>Prze<span>bieg</span></b></div>
    <nav id="side-nav"></nav>
    <button class="btn-primary" data-act="add"><svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>Dodaj</button>
    <div class="side-foot">
      <button class="nav-item" data-act="drive"><span style="position:relative;display:flex"><svg class="i" viewBox="0 0 24 24"><path d="M7 18h10a4 4 0 0 0 .6-7.95A6 6 0 0 0 6.1 9.6 4.2 4.2 0 0 0 7 18z"/></svg><span class="sync-dot" style="top:-2px;right:-3px;border-color:var(--panel)"></span></span><span id="side-sync">Dysk Google</span></button>
      <button class="nav-item" data-act="settings"><svg class="i" viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>Ustawienia</button>
    </div>
  </aside>
  <div class="content">
    <header class="head">
      <h1 id="page-title">Pulpit</h1>
      <button class="icon-btn" data-act="drive" aria-label="Synchronizacja"><svg class="i" viewBox="0 0 24 24"><path d="M7 18h10a4 4 0 0 0 .6-7.95A6 6 0 0 0 6.1 9.6 4.2 4.2 0 0 0 7 18z"/></svg><span class="sync-dot"></span></button>
      <button class="icon-btn" data-act="settings" aria-label="Ustawienia"><svg class="i" viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg></button>
    </header>
    <main id="main">
      <section class="view active" id="view-home"></section>
      <section class="view" id="view-list"></section>
      <section class="view" id="view-progress"></section>
      <section class="view" id="view-body"></section>
    </main>
  </div>
</div>
<nav class="tabbar" id="tabbar"></nav>

<div class="detail" id="detail">
  <div class="detail-top">
    <button class="icon-btn" id="detail-back" aria-label="Wróć"><svg class="i" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
    <div class="detail-title" id="detail-title"></div>
  </div>
  <div class="detail-body" id="detail-body"><div class="detail-inner" id="detail-inner"></div></div>
</div>

<input type="file" id="file-input" accept=".fit,.FIT,.zip,.csv,application/zip,application/octet-stream,text/csv" multiple hidden>
<div class="tip" id="tip"></div>
<div id="toast"></div>
<div class="drop-hint" id="drop-hint">Upuść pliki FIT lub CSV</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script type="module" src="./app.js"></script>
</body>
</html>
